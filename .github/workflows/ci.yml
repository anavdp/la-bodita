name: CI

# Runs on every branch, not just main: the pre-commit hook is opt-in per clone
# (git config core.hooksPath .githooks), so CI is the only unconditional gate.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, 85% coverage floor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The 85% floor lives in pyproject.toml addopts, so a plain run is the gate.
      - name: Test
        run: pytest

      - name: Check migrations apply to an empty database
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_check.db

      - name: Check no model changes are missing a migration
        run: alembic check
        env:
          DATABASE_URL: sqlite:///./ci_check.db

  frontend:
    name: Frontend (Vitest, 85% coverage floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The frontend is scaffolded in issue #1. Until package.json exists there
      # is nothing to run, and this job no-ops instead of failing the build.
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not present yet — skipping (see issue #1)"
          fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.scaffolded == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.scaffolded == 'true'
        working-directory: frontend
        run: npm ci

      - name: Test
        if: steps.detect.outputs.scaffolded == 'true'
        working-directory: frontend
        run: npm run test:coverage
