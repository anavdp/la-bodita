name: CI

# Runs on every branch, not just main: the pre-commit hook is opt-in per clone
# (git config core.hooksPath .githooks), so CI is the only unconditional gate.
on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (pytest, 85% coverage floor)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # The 85% floor lives in pyproject.toml addopts, so a plain run is the gate.
      - name: Test
        run: pytest

      - name: Check migrations apply to an empty database
        run: alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci_check.db

      - name: Check no model changes are missing a migration
        run: alembic check
        env:
          DATABASE_URL: sqlite:///./ci_check.db

  frontend:
    name: Frontend (Vitest, 85% coverage floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The frontend is scaffolded in issue #1. Until package.json exists there
      # is nothing to run, and this job no-ops instead of failing the build.
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "scaffolded=true" >> "$GITHUB_OUTPUT"
          else
            echo "scaffolded=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not present yet — skipping (see issue #1)"
          fi

      - uses: actions/setup-node@v7
        if: steps.detect.outputs.scaffolded == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        if: steps.detect.outputs.scaffolded == 'true'
        working-directory: frontend
        run: npm ci

      - name: Test
        if: steps.detect.outputs.scaffolded == 'true'
        working-directory: frontend
        run: npm run test:coverage

  # Publishes the images the Pi runs, once both test suites have passed on main.
  # Needs the DOCKERHUB_TOKEN repository secret (see deploy/README.md). On a
  # pull request it only checks that the images still build, without pushing.
  publish:
    name: Publish images to Docker Hub
    needs: [backend, frontend]
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Never cancel a publish halfway: latest could point at a half-pushed set.
    concurrency:
      group: publish
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - image: la-bodita-backend
            context: backend
          - image: la-bodita-web
            context: frontend
    env:
      DOCKERHUB_USERNAME: vitaledepalma
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7

      # The Pi is arm64; amd64 lets the same images run on a laptop.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # "latest" for the Pi, plus "sha-1a2b3c4" so any earlier version can be
      # brought back.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          build-contexts: deploy=deploy
          # Guests' RSVP links are built into the web image.
          build-args: VITE_PUBLIC_URL=${{ vars.PUBLIC_URL || 'https://labodita.gerardoyvicky.com' }}
          platforms: linux/arm64,linux/amd64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
