# La Bodita on the Raspberry Pi. See deploy/README.md for the setup steps.
#
# The Pi pulls ready-made images that GitHub Actions publishes to Docker Hub on
# every push to main, so it never needs the code, and Watchtower swaps in each
# new version on its own. To build them yourself instead, add
# docker-compose.build.yml (see that file).
services:
  # The full API, used by the planner. Runs the database migrations on start.
  backend:
    image: vitaledepalma/la-bodita-backend:${LA_BODITA_TAG:-latest}
    restart: unless-stopped
    volumes:
      - data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      start_period: 20s

  # The same code with only the guest RSVP routes, for the internet-facing door.
  backend-public:
    image: vitaledepalma/la-bodita-backend:${LA_BODITA_TAG:-latest}
    restart: unless-stopped
    environment:
      GUEST_ONLY: "true"
    # The private backend has already migrated the shared database.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "*"]
    volumes:
      - data:/data
    depends_on:
      backend:
        condition: service_healthy

  # The built planner and RSVP pages, served by Caddy with deploy/Caddyfile
  # baked in.
  web:
    image: vitaledepalma/la-bodita-web:${LA_BODITA_TAG:-latest}
    restart: unless-stopped
    ports:
      # The planner, also reachable from the Pi itself for a quick check.
      - "127.0.0.1:8080:8080"
    depends_on:
      - backend
      - backend-public

  # Opens :8081 (guests) and, behind Cloudflare Access, :8080 (the planner) to
  # the internet without opening a port on the router.
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      - web

  # Checks Docker Hub every hour and restarts any service whose image has a newer
  # version, so a push to main reaches the Pi without logging in to it.
  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: "3600"
      DOCKER_API_VERSION: "1.40"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  data:
