# Builds the images from this checkout instead of pulling them from Docker Hub,
# for trying a change before it is pushed:
#
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Needs PUBLIC_URL in .env, since the web image bakes in the guests' address.
services:
  backend:
    build: ./backend
  backend-public:
    build: ./backend
  web:
    build:
      context: ./frontend
      additional_contexts:
        deploy: ./deploy
      args:
        VITE_PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
        VITE_PHOTOS_URL: ${PHOTOS_URL:-}
