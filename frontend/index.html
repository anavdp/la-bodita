<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>La Bodita</title>
    <!--
      Link preview for the RSVP link shared on WhatsApp. Its crawler reads this
      file without running JavaScript, so these tags must stay static here.
      og:image and twitter:image must become an absolute https URL on the public
      host once there is one (e.g. https://<public-host>/invitation-preview.jpg):
      crawlers ignore relative paths. The image itself is
      public/invitation-preview.jpg (1200x630, under 300KB) - replace that file
      with the real invitation.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="La Bodita · You're invited / Estás invitado" />
    <meta
      property="og:description"
      content="Find your invitation and RSVP · Encuentra tu invitación y confirma tu asistencia"
    />
    <meta property="og:image" content="/invitation-preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/invitation-preview.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600&family=Manrope:wght@400;500;600;700;800&family=Quicksand:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
